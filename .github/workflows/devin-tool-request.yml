name: tool-request

on:
  issues:
    types: [opened, labeled, edited]

jobs:
  route:
    if: contains(github.event.issue.labels.*.name, 'tool-request')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Acknowledge tool request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "Tool request received. This issue is labeled \`tool-request\` and should be picked up by Devin with the full repository context. Expected output: a new app under \`apps/<issue-name>\` with \`app.yaml\`, \`schema.sql\` and \`seed-data.sql\`, plus a requirement-to-implementation table in the PR body."
