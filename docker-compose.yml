services:
  postgres:
    image: postgres:15
    container_name: tools-kernel-postgres
    environment:
      POSTGRES_DB: tools_kernel
      POSTGRES_USER: tools_kernel
      POSTGRES_PASSWORD: tools_kernel_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh
      - ./core:/core
      - ./apps:/apps

volumes:
  postgres_data: