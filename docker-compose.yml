version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: tools-kernel-postgres
    environment:
      POSTGRES_DB: tools_kernel
      POSTGRES_USER: tools_kernel
      POSTGRES_PASSWORD: tools_kernel_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: